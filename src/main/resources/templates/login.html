<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MyBank</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf2ff, #ffffff);
        }

        /* Header */

        header {
            width: 100%;
            height: 70px;
            background: #0b3d91;

            display: flex;
            align-items: center;

            padding: 0 6%;
        }

        .logo {
            color: white;
            font-size: clamp(22px, 4vw, 28px);
            font-weight: bold;
        }

        .logo span {
            color: #5eead4;
        }

        /* Main */

        .page-container {
            min-height: calc(100vh - 120px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        /* Login Card */

        .login-container {
            width: min(100%, 420px);

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .login-container h1 {
            text-align: center;

            color: #0b3d91;

            font-size: clamp(25px, 5vw, 32px);

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;

            font-size: 14px;
        }

        /* Error Message */

        .error-message {
            background: #fee2e2;
            color: #dc2626;

            padding: 10px;
            border-radius: 8px;

            text-align: center;

            margin-bottom: 20px;

            font-size: 14px;
            font-weight: bold;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Button */

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #0b3d91;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #082f70;
        }

        /* Links */

        .forgot {
            text-align: right;

            margin-top: 10px;

            margin-bottom: 20px;
        }

        .forgot a,
        .register a {
            color: #0b3d91;

            text-decoration: none;

            font-weight: bold;
        }

        .register {
            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }

        /* Footer */

        footer {
            text-align: center;

            color: #777;

            font-size: 13px;

            padding: 15px;
        }

        /* Mobile */

        @media (max-width: 480px) {

            header {
                height: 60px;
                padding: 0 20px;
            }

            .page-container {
                padding: 25px 15px;
            }

            .login-container {
                padding: 28px 22px;

                border-radius: 12px;
            }

            input,
            button {
                padding: 12px;
            }
        }

    </style>
</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            My<span>Bank</span>
        </div>

    </header>


    <!-- Login -->

    <main class="page-container">

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your MyBank account
            </p>


            <!-- Login Error -->

            <div class="error-message" th:if="${param.error}">
                Invalid email or password
            </div>


            <form action="/login" method="post">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="register">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </main>


    <footer>

        © 2026 MyBank. All Rights Reserved.

    </footer>

</body>
</html>
